<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дневник трейдера</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4caf50">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dexie@3/dist/dexie.min.js"></script>
<style>
  :root { --bg:#111; --card:#1e1e1e; --text:#eee; --accent:#4caf50; --loss:#f44336; }
  .light { --bg:#f5f5f5; --card:#fff; --text:#111; --accent:#2e7d32; --loss:#c62828; }
  * { box-sizing: border-box; }
  body { font-family: Arial; background:var(--bg); color:var(--text); padding:15px; transition:0.3s; margin:0; }
  h1,h2 { color:var(--accent); }
  label { font-size:13px; opacity:0.7; }
  input, select, button { padding:10px; margin:4px 0; border-radius:8px; border:none; background:#333; color:#fff; font-size:15px; width:100%; }
  .light input, .light select { background:#ddd; color:#111; }
  button { background:var(--accent); cursor:pointer; font-weight:bold; }
  button:hover { opacity:0.9; }
  table { border-collapse:collapse; width:100%; margin-top:10px; font-size:12px; }
  th, td { border:1px solid #333; padding:5px; text-align:center; }
  th { background:#222; }
  .light th { background:#ddd; }
  .win { color:var(--accent); }
  .loss { color:var(--loss); }
  .card { background:var(--card); padding:15px; border-radius:12px; margin-bottom:15px; }
  canvas { max-height:260px; }
  .del-btn { background:transparent; color:var(--loss); border:none; font-size:16px; cursor:pointer; width:auto; }
  .edit-btn { background:transparent; color:#ffc107; border:none; font-size:16px; cursor:pointer; width:auto; }
  .danger { background:var(--loss); }
  .cancel { background:#555; }
  .edit-mode { color:#ffc107; margin-bottom:10px; font-weight:bold; }
</style>
</head>
<body>

<button onclick="toggleTheme()">🌙 / ☀️ Тема</button>
<h1>📒 Дневник трейдера</h1>

<div class="card">
  <h2>🧮 Калькулятор TP / SL</h2>
  <label>Цена входа</label>
  <input id="calcEntry" type="number" step="any" placeholder="Например, 1000">
  <label>Стоп-лосс (цена)</label>
  <input id="calcStop" type="number" step="any" placeholder="Например, 990">
  <label>Соотношение R:R (например, 2 для 1:2)</label>
  <input id="calcRR" type="number" step="any" value="2">
  <label>Комиссия (в обе стороны), ₽</label>
  <input id="calcComm" type="number" step="any" value="2">
  <button onclick="calcTPSL()">Рассчитать TP</button>
  <div id="calcResult" style="margin-top:10px;"></div>
  <button class="cancel" onclick="applyCalc()">📋 Применить в форму</button>
</div>
  
<div class="card">
  <h2>➕ Добавить сделку</h2>
  <div id="editMode" class="edit-mode"></div>
  <label>Инструмент</label><input id="instr">
  <label>Направление</label>
  <select id="dir"><option>Long</option><option>Short</option></select>
  <label>Цена входа</label><input id="entry" type="number" step="any">
  <label>Цена выхода</label><input id="exit" type="number" step="any">
  <label>Стоп-лосс (изначальный!)</label><input id="stop" type="number" step="any">
  <label>Количество акций</label><input id="qty" type="number" step="any">
  <label>Комиссия за вход, ₽</label><input id="commIn" type="number" step="any">
  <label>Комиссия за выход, ₽</label><input id="commOut" type="number" step="any">
  <label>Тариф, ₽</label><input id="tarif" type="number" step="any">
  <label>Пополнение, ₽</label><input id="topup" type="number" step="any">
  <label>Дата</label><input id="date" type="date">
  <label>Время</label><input id="time" type="time">
  <button onclick="addTrade()">💾 Сохранить</button>
  <button class="cancel" onclick="clearFields()">❌ Отмена</button>
</div>

<div class="card">
  <h2>💾 Резервная копия</h2>
  <button onclick="exportData()">📤 Экспорт в файл</button>
  <input type="file" id="importFile" accept=".json" style="display:none">
  <button onclick="document.getElementById('importFile').click()">📥 Импорт из файла</button>
</div>

<div class="card">
  <h2>📅 Фильтр по датам</h2>
  <label>От</label><input id="filterFrom" type="date" onchange="render()">
  <label>До</label><input id="filterTo" type="date" onchange="render()">
  <button onclick="clearFilter()">Сбросить фильтр</button>
</div>

<div class="card"><h2>📊 Статистика</h2><div id="stats"></div></div>

<div class="card">
  <h2>🎯 Планировщик</h2>
  <input id="goal" placeholder="Цель, ₽" type="number">
  <select id="period">
    <option value="5">1 неделя</option>
    <option value="10">2 недели</option>
    <option value="20">1 месяц</option>
  </select>
  <button onclick="calcPlan()">Рассчитать депозит</button>
  <div id="planResult"></div>
</div>

<div class="card"><h2>📈 График доходности и просадки</h2><canvas id="equityChart"></canvas></div>
<div class="card"><h2>🧠 Советы</h2><div id="advice"></div></div>
<div class="card"><h2>📊 По инструментам</h2><div id="instrStats"></div></div>

<div class="card">
  <h2>📋 Сделки</h2>
  <button onclick="exportExcel()">📥 Экспорт в Excel</button>
  <button class="danger" onclick="resetAll()">🗑 Сбросить всё</button>
  <table id="tradesTable">
    <thead>
      <tr>
        <th>№</th><th>Дата</th><th>Инстр.</th><th>Напр.</th><th>Вход</th><th>Выход</th>
        <th>Стоп</th><th>Кол</th><th>Ком. вход</th><th>Ком. выход</th>
        <th>Прибыль</th><th>R:R</th><th>Время</th><th>Win/Loss</th><th>Действия</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
const db = new Dexie('TraderDB');
db.version(1).stores({ trades: '++id, instr, date' });

let trades = [];
let editIndex = -1;
let chart;

function toggleTheme() { document.body.classList.toggle('light'); }

async function loadTrades() {
  trades = await db.trades.toArray();
  render();
}

async function addTrade() {
  const t = {
    instr: document.getElementById('instr').value.trim(),
    dir: document.getElementById('dir').value,
    entry: +document.getElementById('entry').value,
    exit: +document.getElementById('exit').value,
    stop: +document.getElementById('stop').value,
    qty: +document.getElementById('qty').value,
    commIn: +document.getElementById('commIn').value || 0,
    commOut: +document.getElementById('commOut').value || 0,
    tarif: +document.getElementById('tarif').value || 0,
    topup: +document.getElementById('topup').value || 0,
    date: document.getElementById('date').value || new Date().toISOString().slice(0, 10),
    time: document.getElementById('time').value || '00:00'
  };

  if (!t.instr || !t.entry || !t.qty) {
    alert('⚠️ Заполни: Инструмент, Цена входа, Количество!');
    return;
  }

  // Прибыль
  const gross = t.dir === 'Long'
    ? (t.exit - t.entry) * t.qty
    : (t.entry - t.exit) * t.qty;
  t.profit = gross - t.commIn - t.commOut - t.tarif;

  // === R:R ===
  const riskPerShare = Math.abs(t.entry - t.stop);
  if (riskPerShare === 0) {
    t.risk = t.entry * 0.01 * t.qty; // 1% от входа, если стоп = вход
    t.rr = 0;
  } else {
    t.risk = riskPerShare * t.qty;
    t.rr = Math.abs(t.exit - t.entry) / riskPerShare;
  }

  t.result = t.profit > 0 ? 'Win' : t.profit < 0 ? 'Loss' : 'BE';

  if (editIndex >= 0) {
    t.id = trades[editIndex].id;
    await db.trades.put(t);
    editIndex = -1;
    alert('✅ Сделка обновлена!');
  } else {
    await db.trades.add(t);
    alert('✅ Сделка добавлена!');
  }

  clearFields();
  loadTrades();
}

function clearFields() {
  ['instr','entry','exit','stop','qty','commIn','commOut','tarif','topup','date','time']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('editMode').textContent = '';
  editIndex = -1;
}

async function deleteTrade(id) {
  if (!confirm('Удалить сделку?')) return;
  await db.trades.delete(id);
  loadTrades();
}

function editTrade(id) {
  const t = trades.find(x => x.id === id);
  if (!t) return;

  document.getElementById('instr').value = t.instr || '';
  document.getElementById('dir').value = t.dir || 'Long';
  document.getElementById('entry').value = t.entry || '';
  document.getElementById('exit').value = t.exit || '';
  document.getElementById('stop').value = t.stop || '';
  document.getElementById('qty').value = t.qty || '';
  document.getElementById('commIn').value = t.commIn || '';
  document.getElementById('commOut').value = t.commOut || '';
  document.getElementById('tarif').value = t.tarif || '';
  document.getElementById('topup').value = t.topup || '';
  document.getElementById('date').value = t.date || '';
  document.getElementById('time').value = t.time || '';

  editIndex = trades.indexOf(t);
  document.getElementById('editMode').textContent = '✏️ Редактируешь: ' + t.instr + ' от ' + (t.date || '');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function resetAll() {
  if (!confirm('Удалить ВСЕ сделки?')) return;
  await db.trades.clear();
  loadTrades();
}

function clearFilter() {
  document.getElementById('filterFrom').value = '';
  document.getElementById('filterTo').value = '';
  render();
}

function getFiltered() {
  const from = document.getElementById('filterFrom').value;
  const to = document.getElementById('filterTo').value;
  return trades.filter(t => {
    if (from && t.date < from) return false;
    if (to && t.date > to) return false;
    return true;
  });
}

function render() {
  const list = getFiltered();
  const tbody = document.querySelector('#tradesTable tbody');
  tbody.innerHTML = '';
  list.forEach(t => {
    tbody.innerHTML += `<tr>
      <td>${t.id}</td><td>${t.date||'-'}</td><td>${t.instr}</td><td>${t.dir}</td>
      <td>${t.entry}</td><td>${t.exit}</td><td>${t.stop}</td><td>${t.qty}</td>
      <td>${t.commIn}</td><td>${t.commOut}</td>
      <td class="${t.profit>0?'win':'loss'}">${t.profit.toFixed(2)}</td>
      <td>${(t.rr||0).toFixed(2)}</td><td>${t.time}</td>
      <td class="${t.result==='Win'?'win':'loss'}">${t.result}</td>
      <td>
        <button class="edit-btn" onclick="editTrade(${t.id})">✏️</button>
        <button class="del-btn" onclick="deleteTrade(${t.id})">🗑</button>
      </td>
    </tr>`;
  });

  const wins = list.filter(t => t.result === 'Win').length;
  const losses = list.filter(t => t.result === 'Loss').length;
  const totalProfit = list.reduce((s, t) => s + t.profit, 0);
  const avgRR = list.length ? list.reduce((s, t) => s + (t.rr||0), 0) / list.length : 0;
  const winRate = list.length ? wins / list.length * 100 : 0;
  const deposit = list.reduce((s, t) => s + t.profit + t.topup, 0);

  let peak = 0, acc = 0, maxDD = 0;
  list.forEach(t => {
    acc += t.profit + t.topup;
    if (acc > peak) peak = acc;
    if (peak - acc > maxDD) maxDD = peak - acc;
  });

  document.getElementById('stats').innerHTML = `
    <p>Сделок: <b>${list.length}</b></p>
    <p>Прибыльных: <b class="win">${wins}</b></p>
    <p>Убыточных: <b class="loss">${losses}</b></p>
    <p>Win Rate: <b>${winRate.toFixed(1)}%</b></p>
    <p>Средний R:R: <b>${avgRR.toFixed(2)}</b></p>
    <p>Прибыль: <b class="${totalProfit>0?'win':'loss'}">${totalProfit.toFixed(2)} ₽</b></p>
    <p>Депозит: <b>${deposit.toFixed(2)} ₽</b></p>
    <p>Просадка: <b class="loss">${maxDD.toFixed(2)} ₽</b></p>
  `;

  renderChart(list);
  renderAdvice(winRate, avgRR, totalProfit, maxDD);
  renderInstrStats(list);
}

function renderAdvice(winRate, avgRR, profit, dd) {
  let tips = [];
  if (trades.length < 10) tips.push('📊 Сделай минимум 10 сделок для статистики.');
  if (winRate < 50 && trades.length >= 10) tips.push('⚠️ Win Rate ниже 50% — проверь входы.');
  if (avgRR < 1.5 && trades.length >= 10) tips.push('📉 R:R ниже 1.5 — ставь дальние тейки.');
  if (dd > Math.abs(profit) * 0.5 && trades.length >= 10) tips.push('⚠️ Просадка большая — снизь риск.');
  if (!tips.length) tips.push('✅ Всё в норме. Продолжай!');
  document.getElementById('advice').innerHTML = tips.map(t => `<p>${t}</p>`).join('');
}

function renderInstrStats(list) {
  const map = {};
  list.forEach(t => {
    if (!map[t.instr]) map[t.instr] = { count: 0, wins: 0, profit: 0 };
    map[t.instr].count++;
    if (t.result === 'Win') map[t.instr].wins++;
    map[t.instr].profit += t.profit;
  });
  let html = '<table><tr><th>Инструмент</th><th>Сделок</th><th>Win Rate</th><th>Прибыль</th></tr>';
  for (const k in map) {
    const m = map[k];
    html += `<tr><td>${k}</td><td>${m.count}</td><td>${(m.wins / m.count * 100).toFixed(1)}%</td>
      <td class="${m.profit > 0 ? 'win' : 'loss'}">${m.profit.toFixed(2)} ₽</td></tr>`;
  }
  html += '</table>';
  document.getElementById('instrStats').innerHTML = html;
}

function renderChart(list) {
  let acc = 0, peak = 0;
  const labels = [], data = [], dd = [];
  list.forEach((t, i) => {
    acc += t.profit + t.topup;
    if (acc > peak) peak = acc;
    labels.push(i + 1); data.push(acc); dd.push(peak - acc);
  });
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('equityChart'), {
    type: 'line',
    data: {
      labels, datasets: [
        { label: 'Депозит', data, borderColor: '#4caf50', backgroundColor: 'rgba(76,175,80,0.2)', fill: true, tension: 0.3 },
        { label: 'Просадка', data: dd, borderColor: '#f44336', backgroundColor: 'rgba(244,67,54,0.2)', fill: true, tension: 0.3 }
      ]
    },
    options: { plugins: { legend: { labels: { color: '#888' } } } }
  });
}

function calcPlan() {
  const goal = +document.getElementById('goal').value;
  const n = +document.getElementById('period').value;
  const wins = n * 0.6, losses = n * 0.4;
  const factor = wins * 2 - losses;
  const risk = goal / factor;
  document.getElementById('planResult').innerHTML = `
    <p>Цель: <b>${goal} ₽</b></p>
    <p>Сделок: <b>${n}</b></p>
    <p>Риск на сделку: <b>${risk.toFixed(2)} ₽</b></p>
    <p>Нужный депозит: <b>${(risk * 100).toFixed(2)} ₽</b></p>
  `;
}

function exportExcel() {
  let csv = 'Дата,Инструмент,Направление,Вход,Выход,Стоп,Кол-во,Ком.вход,Ком.выход,Прибыль,R:R,Время,Результат\n';
  trades.forEach(t => {
    csv += `${t.date || ''},${t.instr},${t.dir},${t.entry},${t.exit},${t.stop},${t.qty},${t.commIn},${t.commOut},${t.profit.toFixed(2)},${(t.rr || 0).toFixed(2)},${t.time},${t.result}\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'trades.csv'; a.click();
}

async function exportData() {
  const data = await db.trades.toArray();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'trader_backup.json';
  a.click();
}

async function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const text = await file.text();
  let data = JSON.parse(text);

  data = data
    .filter(t => t.instr && t.qty > 0)
    .map(t => {
      t.stop = t.stop || t.entry;
      t.commIn = t.commIn || 0;
      t.commOut = t.commOut || 0;
      t.tarif = t.tarif || 0;
      t.topup = t.topup || 0;

      const gross = t.dir === 'Long'
        ? (t.exit - t.entry) * t.qty
        : (t.entry - t.exit) * t.qty;
      t.profit = gross - t.commIn - t.commOut - t.tarif;

      const riskPerShare = Math.abs(t.entry - t.stop);
      if (riskPerShare === 0) {
        t.risk = t.entry * 0.01 * t.qty;
        t.rr = 0;
      } else {
        t.risk = riskPerShare * t.qty;
        t.rr = Math.abs(t.exit - t.entry) / riskPerShare;
      }

      t.result = t.profit > 0 ? 'Win' : t.profit < 0 ? 'Loss' : 'BE';
      return t;
    });

  await db.trades.bulkPut(data);
  loadTrades();
  alert('✅ Загружено сделок: ' + data.length);
}

document.getElementById('importFile').addEventListener('change', importData);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js');
}

// === КАЛЬКУЛЯТОР TP/SL ===
function calcTPSL() {
  const entry = +document.getElementById('calcEntry').value;
  const stop = +document.getElementById('calcStop').value;
  const rr = +document.getElementById('calcRR').value;

  if (!entry || !stop || !rr) {
    document.getElementById('calcResult').innerHTML = '<p style="color:#f44336;">⚠️ Заполни все поля!</p>';
    return;
  }

  const risk = Math.abs(entry - stop);
  const reward = risk * rr;
  const isLong = entry > stop;

  const tp = isLong ? entry + reward : entry - reward;
  const comm = +document.getElementById('calcComm').value || 0;
  const netReward = reward - comm;
  const netRisk = risk + comm;
  document.getElementById('calcResult').innerHTML += `
    <p>💸 Чистая прибыль: <b>${netReward.toFixed(2)} ₽</b></p>
    <p>💸 Чистый риск: <b>${netRisk.toFixed(2)} ₽</b></p>
  `;
  
  document.getElementById('calcResult').innerHTML = `
    <p>📉 Риск (SL): <b>${risk.toFixed(2)} ₽</b></p>
    <p>📈 Прибыль (TP): <b>${reward.toFixed(2)} ₽</b></p>
    <p>🎯 Цена TP: <b>${tp.toFixed(2)} ₽</b></p>
    <p>⚖️ R:R = <b>1 : ${rr}</b></p>
    <p style="color:${rr >= 2 ? '#4caf50' : '#ffc107'};">
      ${rr >= 2 ? '✅ Хорошая сделка' : '⚠️ R:R ниже 2 — рискованно'}
    </p>
  `;

  // Сохраняем для applyCalc
  window._calcTP = tp;
  window._calcSL = stop;
  window._calcEntry = entry;
}

function applyCalc() {
  if (!window._calcEntry) {
    alert('Сначала нажми "Рассчитать TP"');
    return;
  }
  document.getElementById('entry').value = window._calcEntry;
  document.getElementById('stop').value = window._calcSL;
  document.getElementById('exit').value = window._calcTP;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
  
loadTrades();
</script>
</body>
</html>
